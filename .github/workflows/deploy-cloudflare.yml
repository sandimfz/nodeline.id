name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "admin/**"
      - ".github/workflows/deploy-cloudflare.yml"

jobs:
  deploy-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build (OpenNext)
        run: bunx opennextjs-cloudflare build
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SESSION_COOKIE_NAME: ${{ secrets.SESSION_COOKIE_NAME }}
          # tambahkan NEXT_PUBLIC_* lain yang dipakai di client

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: client
          command: deploy

  deploy-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build (OpenNext)
        run: bunx opennextjs-cloudflare build
        env:
          VITE_ADMIN_LOGIN_PATH: ${{ secrets.VITE_ADMIN_LOGIN_PATH }}
          API_TARGET: ${{ secrets.API_TARGET }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin
          command: deploy